<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>KREAM 수정 대상</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 40px;
}
h2 {
  margin-bottom: 10px;
}
.info {
  margin-bottom: 20px;
  color: #555;
}
button {
  padding: 8px 14px;
  margin-right: 8px;
  cursor: pointer;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: center;
}
th {
  background: #f5f5f5;
}
tr:hover {
  background: #fafafa;
}
</style>
</head>
<body>

<h2 id="title">KREAM 수정 대상</h2>

<div class="info">
  <button onclick="location.href='/target_view.html?type=pokemon'">포켓몬 표</button>
  <button onclick="location.href='/target_view.html?type=onepiece'">원피스 표</button>
</div>

<div class="info" id="fileInfo"></div>

<table>
<thead>
<tr>
  <th>No</th>
  <th>상품명</th>
  <th>옵션</th>
  <th>현재가</th>
  <th>최저가</th>
  <th>차액</th>
</tr>
</thead>
<tbody id="tbody">
</tbody>
</table>

<script>
function formatWon(value) {
  const num = Number(value || 0);
  return num.toLocaleString('ko-KR') + '원';
}

function getType() {
  const params = new URLSearchParams(location.search);
  return params.get('type') || 'all';
}

function getTypeName(type) {
  if (type === 'pokemon') return '포켓몬';
  if (type === 'onepiece') return '원피스';
  return '전체';
}

async function loadTargets() {
  const type = getType();
  const res = await fetch(`/api/targets?type=${type}`);
  const data = await res.json();

  if (!data.success) {
    alert(data.message || '불러오기 실패');
    return;
  }

  const items = data.items || [];
  const typeName = getTypeName(type);

  document.getElementById('title').innerText =
    `KREAM ${typeName} 수정 대상 ${items.length}개`;

  document.getElementById('fileInfo').innerText =
    `읽는 파일: ${data.file || '-'}`;

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (items.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="6">수정 대상 없음</td>
      </tr>
    `;
    return;
  }

  items.forEach((item, index) => {
    const diff = Number(item.myPrice || 0) - Number(item.lowestPrice || 0);

    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>${index + 1}</td>
      <td>${item.koreanName || ''}</td>
      <td>${item.option || ''}</td>
      <td>${formatWon(item.myPrice)}</td>
      <td>${formatWon(item.lowestPrice)}</td>
      <td>${formatWon(diff)}</td>
    `;

    tbody.appendChild(tr);
  });
}

loadTargets();
</script>

</body>
</html>
